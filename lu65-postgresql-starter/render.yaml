services:
  - type: web
    name: kalvium-516-postgresql
    runtime: node
    rootDir: lu65-postgresql-starter
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: NODE_ENV
        value: production
